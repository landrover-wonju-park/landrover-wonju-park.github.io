<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜드로버 차량 갤러리</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background: #f5f5f3;
    color: #222;
    font-family: Arial, "Malgun Gothic", sans-serif;
}
header {
    background: #182820;
    color: white;
    padding: 35px 15px;
    text-align: center;
}
header h1 {
    font-size: 26px;
    letter-spacing: 3px;
}
header p {
    font-size: 14px;
}
.home {
    display: inline-block;
    color: white;
    text-decoration: none;
    border: 1px solid #aaa;
    padding: 12px 20px;
    margin-top: 12px;
}
.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px 15px;
}
.models {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}
button {
    cursor: pointer;
    font-family: inherit;
}
.model-btn, .tab-btn {
    border: 1px solid #ccc;
    background: white;
    color: #222;
    padding: 16px 8px;
    font-size: 14px;
    border-radius: 4px;
}
.active {
    background: #182820;
    color: white;
    border-color: #182820;
}
.model-title {
    text-align: center;
    font-size: 26px;
    margin: 35px 0 20px;
}
.tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
}
.tab-btn {
    width: 150px;
}
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}
.photo-card {
    background: white;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 2px 8px #00000012;
}
.photo-card img {
    display: block;
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: contain;
    cursor: zoom-in;
    background: #eee;
}
.photo-card h3 {
    font-size: 14px;
    text-align: center;
    margin: 14px 8px;
}
.empty {
    grid-column: 1 / -1;
    padding: 50px 15px;
    text-align: center;
    color: #777;
    background: white;
}
.notice, #status {
    text-align: center;
    font-size: 12px;
    color: #777;
    margin: 20px 0;
    line-height: 1.8;
}
footer {
    text-align: center;
    background: #182820;
    color: white;
    padding: 30px 15px;
    font-size: 13px;
    line-height: 1.8;
}
.viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.95);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}
.viewer img {
    max-width: 95%;
    max-height: 85vh;
    object-fit: contain;
}
.viewer p {
    color: white;
}
.close {
    position: absolute;
    right: 20px;
    top: 15px;
    color: white;
    background: transparent;
    border: 0;
    font-size: 36px;
}
.retry {
    padding: 8px 15px;
    background: white;
    border: 1px solid #aaa;
    border-radius: 4px;
}
@media (max-width: 600px) {
    .models {
        grid-template-columns: repeat(2, 1fr);
    }
    .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }
    header h1 {
        font-size: 21px;
    }
    .model-title {
        font-size: 23px;
    }
    .photo-card h3 {
        font-size: 12px;
    }
}
</style>
</head>
<body>

<header>
    <h1>LAND ROVER GALLERY</h1>
    <p>차량별 외장 색상 및 실내 시트 갤러리</p>
    <a class="home" href="./index.html">홈페이지 돌아가기</a>
</header>

<main class="container">

<div class="models">
    <button class="model-btn active" data-model="rr">RANGE ROVER</button>
    <button class="model-btn" data-model="rrs">RANGE ROVER SPORT</button>
    <button class="model-btn" data-model="defender">DEFENDER</button>
    <button class="model-btn" data-model="velar">VELAR</button>
</div>

<h2 class="model-title" id="modelTitle">레인지로버</h2>

<div class="tabs">
    <button class="tab-btn active" data-tab="exterior">외장 색상</button>
    <button class="tab-btn" data-tab="interior">실내 시트</button>
</div>

<div id="status"></div>
<div class="gallery" id="gallery"></div>

<p class="notice">
실제 차량 색상은 촬영 환경 및 화면 설정에 따라 다르게 보일 수 있습니다.<br>
색상별 출고 가능 여부는 별도 문의 부탁드립니다.
</p>

</main>

<footer>
KCC AUTOMOBILE<br>
랜드로버 원주전시장 박천태 부장
</footer>

<div class="viewer" id="viewer">
    <button class="close" aria-label="닫기" onclick="closeViewer()">×</button>
    <img id="largePhoto" alt="">
    <p id="photoName"></p>
</div>

<script>
const owner = "landrover-wonju-park";
const repo = "landrover-wonju-park.github.io";

const carNames = {
    rr: "레인지로버",
    rrs: "레인지로버 스포츠",
    defender: "디펜더",
    velar: "벨라"
};

const originalPhoto = {
    model: "rr",
    category: "exterior",
    name: "레인지로버",
    src: "./KakaoTalk_20261121_153022327.jpg"
};

let currentModel = "rr";
let currentTab = "exterior";
let allPhotos = [originalPhoto];
let loadState = "loading";
let errorMessage = "";

function showGallery() {
    document.getElementById("modelTitle").textContent =
        carNames[currentModel];

    const gallery = document.getElementById("gallery");
    const status = document.getElementById("status");

    gallery.innerHTML = "";
    status.innerHTML = "";

    const items = allPhotos.filter(item =>
        item.model === currentModel &&
        item.category === currentTab
    );

    if (loadState === "loading") {
        status.textContent = "추가 사진을 불러오는 중입니다.";
    } else if (loadState === "error") {
        status.textContent = errorMessage + " ";

        const retry = document.createElement("button");
        retry.className = "retry";
        retry.textContent = "다시 불러오기";
        retry.onclick = loadPhotos;
        status.appendChild(retry);
    } else {
        status.textContent = "등록 사진 " + items.length + "장";
    }

    if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = loadState === "loading"
            ? "사진을 불러오는 중입니다."
            : loadState === "error"
                ? "사진 목록을 확인하지 못했습니다."
                : "사진 준비 중입니다.";

        gallery.appendChild(empty);
        return;
    }

    items.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "photo-card";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.name;
        img.loading = "lazy";

        const title = document.createElement("h3");
        title.textContent = item.name;

        img.onclick = () => {
            document.getElementById("largePhoto").src = img.src;
            document.getElementById("photoName").textContent = item.name;
            document.getElementById("viewer").style.display = "flex";
        };

        img.onerror = () => {
            if (item.fallback && img.dataset.retried !== "yes") {
                img.dataset.retried = "yes";
                img.src = item.fallback;
            } else {
                title.textContent = "사진 불러오기 오류";
            }
        };

        card.appendChild(img);
        card.appendChild(title);
        gallery.appendChild(card);
    });
}

async function loadPhotos() {
    loadState = "loading";
    showGallery();

    try {
        const response = await fetch(
            "./photos.json?v=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const newPhotos = await response.json();

        if (!Array.isArray(newPhotos)) {
            throw new Error("사진 목록 오류");
        }

        allPhotos = [originalPhoto, ...newPhotos];
        loadState = "ready";

    } catch (error) {
        loadState = "error";
        errorMessage = "사진 불러오기 실패: " + error.message;
    }

    showGallery();
}

document.querySelectorAll(".model-btn").forEach(btn => {
    btn.onclick = () => {
        currentModel = btn.dataset.model;
        document.querySelectorAll(".model-btn").forEach(b =>
            b.classList.remove("active")
        );
        btn.classList.add("active");
        showGallery();
    };
});

document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => {
        currentTab = btn.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach(b =>
            b.classList.remove("active")
        );
        btn.classList.add("active");
        showGallery();
    };
});

function closeViewer() {
    document.getElementById("viewer").style.display = "none";
}

document.getElementById("viewer").onclick = event => {
    if (event.target.id === "viewer") {
        closeViewer();
    }
};

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeViewer();
    }
});

showGallery();
loadPhotos();
</script>

</body>
</html>
